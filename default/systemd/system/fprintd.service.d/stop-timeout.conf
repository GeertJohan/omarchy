[Service]
# The resume hook restarts fprintd synchronously, while user sessions are still
# frozen, so whatever the stop costs is added to the thaw. A healthy daemon --
# even one holding a claim -- stops in about 2ms, but a wedged one does not
# answer SIGTERM at all and has to be killed: measured at 5.08s and 5.02s
# against Omarchy's DefaultTimeoutStopSec=5s. That is the case the hook exists
# for, so without a cap the recovery is slower than the failure it repairs.
#
# 3s is well clear of a healthy stop and still leaves the hook's 10s bound room
# for the start that follows.
TimeoutStopSec=3s
